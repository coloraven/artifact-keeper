# Build release binaries for deploy into UBI9 backend containers (deploy-host).
#
# IMPORTANT: Do NOT build on bare ubuntu-latest — that links against glibc 2.39+
# and will fail at runtime on RHEL/UBI 9 (glibc ~2.34) with:
#   /lib64/libc.so.6: version `GLIBC_2.38' not found
# Build inside ubi9/ubi:9.8 to match docker/Dockerfile.backend runtime.
#
# Triggers: manual dispatch, or push to feat/** / fix/** branches.
# Download artifacts via local proxy: HTTPS_PROXY=http://127.0.0.1:10811

name: Build Release Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/**"
      - "fix/**"
    paths-ignore:
      - "**/*.md"
      - "site/**"
      - ".beads/**"

permissions:
  contents: read
  actions: write

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # Cache keys include this label; bump (e.g. stable-2026-08) to force a cold toolchain.
  RUST_TOOLCHAIN: "stable"

jobs:
  build-linux-amd64:
    name: artifact-keeper linux-amd64 (ubi9)
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi9/ubi:9.8
    timeout-minutes: 120
    steps:
      - name: Install OS build dependencies
        run: |
          set -eux
          # UBI ships curl-minimal; do not install full `curl` (conflicts).
          dnf install -y --nodocs \
            gcc gcc-c++ make pkg-config perl-core \
            openssl-devel zlib-devel xz-devel bzip2-devel \
            unzip ca-certificates git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache protoc
        id: cache-protoc
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/protoc
            /usr/local/include/google
          key: ubi9-protoc-29.3-${{ runner.arch }}

      - name: Install protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          set -eux
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) PROTOC_ARCH="linux-x86_64" ;;
            aarch64) PROTOC_ARCH="linux-aarch_64" ;;
            *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
          esac
          curl -fsSL \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-${PROTOC_ARCH}.zip" \
            -o /tmp/protoc.zip
          unzip -q /tmp/protoc.zip -d /usr/local
          rm /tmp/protoc.zip
          test -x /usr/local/bin/protoc

      - name: Cache rustup + cargo registry
        id: cache-cargo-home
        uses: actions/cache@v4
        with:
          path: |
            /root/.rustup
            /root/.cargo/bin
            /root/.cargo/registry/index
            /root/.cargo/registry/cache
            /root/.cargo/git/db
          key: ubi9-cargo-home-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubi9-cargo-home-${{ env.RUST_TOOLCHAIN }}-
            ubi9-cargo-home-

      - name: Install Rust toolchain
        run: |
          set -eux
          export PATH="/root/.cargo/bin:$PATH"
          if command -v rustc >/dev/null 2>&1 && command -v cargo >/dev/null 2>&1; then
            echo "Rust already present (cargo-home cache hit)"
            rustup default "${RUST_TOOLCHAIN}" || \
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain "${RUST_TOOLCHAIN}" --profile minimal
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain "${RUST_TOOLCHAIN}" --profile minimal
          fi
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"
          rustc -V
          cargo -V

      - name: Cache cargo target (release)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          shared-key: release-backend-ubi9
          prefix-key: ubi9-v1
          cache-targets: true
          cache-all-crates: true
          cache-on-failure: true

      - name: Build release binary
        run: |
          set -eux
          # Match docker/Dockerfile.backend (system OpenSSL on UBI9).
          cargo build --release -p artifact-keeper-backend --bin artifact-keeper

      - name: Package
        run: |
          set -eux
          mkdir -p dist
          cp target/release/artifact-keeper dist/artifact-keeper-linux-amd64
          chmod +x dist/artifact-keeper-linux-amd64
          cd dist
          tar -czvf artifact-keeper-linux-amd64.tar.gz artifact-keeper-linux-amd64
          sha256sum artifact-keeper-linux-amd64.tar.gz \
            > artifact-keeper-linux-amd64.tar.gz.sha256
          sha256sum artifact-keeper-linux-amd64 \
            > artifact-keeper-linux-amd64.sha256
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-keeper-linux-amd64
          path: |
            dist/artifact-keeper-linux-amd64
            dist/artifact-keeper-linux-amd64.tar.gz
            dist/artifact-keeper-linux-amd64.tar.gz.sha256
            dist/artifact-keeper-linux-amd64.sha256
          if-no-files-found: error
          retention-days: 14
