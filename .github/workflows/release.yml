# Fork release: attach cross-platform binaries + 中文说明（来源分支显著）。
# Platform matrix matches upstream publish-binaries.yml / release.yml, except
# linux-amd64 is built inside ubi9/ubi:9.8 (glibc match for UBI9/RHEL9 runtime).
#
# 打 tag 并 push：
#   git checkout feat/ferry-ingest
#   git tag v0.1.0-ferry
#   git push origin v0.1.0-ferry

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（例如 v0.1.0-ferry）"
        required: true
      source_branch:
        description: "来源分支（写入 Release 标题）"
        required: true
        default: "feat/ferry-ingest"

permissions:
  contents: write
  actions: write

concurrency:
  group: fork-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_TOOLCHAIN: "stable"

jobs:
  meta:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.out.outputs.tag }}
      source_branch: ${{ steps.out.outputs.source_branch }}
    steps:
      - id: out
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "source_branch=${{ github.event.inputs.source_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "source_branch=feat/ferry-ingest" >> "$GITHUB_OUTPUT"
          fi

  build-linux-amd64:
    name: artifact-keeper linux-amd64 (ubi9)
    needs: [meta]
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi9/ubi:9.8
    timeout-minutes: 120
    steps:
      - name: Install OS build dependencies
        run: |
          set -eux
          dnf install -y --nodocs \
            gcc gcc-c++ make pkg-config perl-core \
            openssl-devel zlib-devel xz-devel bzip2-devel \
            unzip ca-certificates git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Cache protoc
        id: cache-protoc
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/protoc
            /usr/local/include/google
          key: ubi9-protoc-29.3-${{ runner.arch }}

      - name: Install protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          set -eux
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) PROTOC_ARCH="linux-x86_64" ;;
            aarch64) PROTOC_ARCH="linux-aarch_64" ;;
            *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
          esac
          curl -fsSL \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-${PROTOC_ARCH}.zip" \
            -o /tmp/protoc.zip
          unzip -q /tmp/protoc.zip -d /usr/local
          rm /tmp/protoc.zip
          test -x /usr/local/bin/protoc

      - name: Cache rustup + cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ubi9-cargo-home-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubi9-cargo-home-${{ env.RUST_TOOLCHAIN }}-
            ubi9-cargo-home-

      - name: Install Rust toolchain
        run: |
          set -eux
          export PATH="$HOME/.cargo/bin:$PATH"
          if command -v rustc >/dev/null 2>&1 && command -v cargo >/dev/null 2>&1; then
            rustup default "${RUST_TOOLCHAIN}" || true
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain "${RUST_TOOLCHAIN}" --profile minimal
          fi
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc -V
          cargo -V

      - name: Cache cargo target (release)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          shared-key: release-backend-ubi9
          prefix-key: ubi9-v2
          cache-targets: true
          cache-all-crates: true
          cache-on-failure: true

      - name: Set version from tag
        run: |
          VERSION="${{ needs.meta.outputs.tag }}"
          VERSION="${VERSION#v}"
          sed "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml

      - name: Build release binary
        run: |
          set -eux
          . "$HOME/.cargo/env"
          cargo build --release -p artifact-keeper-backend --bin artifact-keeper

      - name: Package
        run: |
          set -eux
          mkdir -p dist
          cp target/release/artifact-keeper dist/artifact-keeper-linux-amd64
          chmod +x dist/artifact-keeper-linux-amd64
          cd dist
          tar -czvf artifact-keeper-linux-amd64.tar.gz artifact-keeper-linux-amd64
          sha256sum artifact-keeper-linux-amd64.tar.gz \
            > artifact-keeper-linux-amd64.tar.gz.sha256
          sha256sum artifact-keeper-linux-amd64 \
            > artifact-keeper-linux-amd64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: artifact-keeper-linux-amd64
          path: dist/**
          if-no-files-found: error

  build-other:
    name: Build ${{ matrix.name }}
    needs: [meta]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: artifact-keeper-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: artifact-keeper-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: artifact-keeper-darwin-arm64
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            name: artifact-keeper-windows-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Windows cross-compilation tools
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get install -y mingw-w64

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set version from tag
        run: |
          VERSION="${{ needs.meta.outputs.tag }}"
          VERSION="${VERSION#v}"
          sed "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --release --target ${{ matrix.target }} --features vendored-openssl

      - name: Package binary (Unix)
        if: "!contains(matrix.target, 'windows')"
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/artifact-keeper dist/${{ matrix.name }}
          chmod +x dist/${{ matrix.name }}
          cd dist
          tar -czvf ${{ matrix.name }}.tar.gz ${{ matrix.name }}
          if command -v sha256sum &>/dev/null; then
            sha256sum ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256
            sha256sum ${{ matrix.name }} > ${{ matrix.name }}.sha256
          else
            shasum -a 256 ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256
            shasum -a 256 ${{ matrix.name }} > ${{ matrix.name }}.sha256
          fi

      - name: Package binary (Windows)
        if: contains(matrix.target, 'windows')
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/artifact-keeper.exe dist/${{ matrix.name }}.exe
          cd dist
          sha256sum ${{ matrix.name }}.exe > ${{ matrix.name }}.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/**
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: [meta, build-linux-amd64, build-other]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compose Chinese release notes
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          BRANCH: ${{ needs.meta.outputs.source_branch }}
        run: |
          set -euo pipefail
          {
            echo "# 本发行来源分支：\`${BRANCH}\`"
            echo ""
            echo "> **coloraven 分叉发行**（非上游 artifact-keeper 官方 Release）。"
            echo "> 标签：\`${TAG}\`　提交：\`${GITHUB_SHA}\`"
            echo ""
            cat RELEASE_NOTES.zh.md
          } > release-body.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find artifacts -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no release assets" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file release-body.md
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "${{ github.repository }}" \
              --title "${TAG}（来源分支 ${{ needs.meta.outputs.source_branch }}）" \
              --notes-file release-body.md \
              --generate-notes
          fi
